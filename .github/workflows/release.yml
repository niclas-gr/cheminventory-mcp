# Publish a v* tag to PyPI, then to the MCP Registry
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing to PyPI, login to the MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Check that the tag matches all versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(uv version --short)" = "$version"
          test "$(jq -r .version server.json)" = "$version"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"

      - run: uv sync --frozen
      - run: uv run --frozen prek run --all-files
      - run: uv build
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Wait until PyPI serves the release
        run: |
          for _ in $(seq 30); do
            curl --fail --silent --output /dev/null \
              "https://pypi.org/pypi/cheminventory-mcp/${GITHUB_REF_NAME#v}/json" && exit 0
            sleep 10
          done
          exit 1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
